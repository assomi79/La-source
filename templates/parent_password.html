<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Changer mot de passe parent</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container mt-5"><div class="row justify-content-center"><div class="col-md-5">
{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}
<div class="card"><div class="card-body"><h4>🔑 Nouveau mot de passe</h4>
<form method="post"><div class="mb-2"><label>Nouveau mot de passe</label><input type="password" name="n1" class="form-control" required></div>
<div class="mb-3"><label>Confirmer</label><input type="password" name="n2" class="form-control" required></div>
<button class="btn btn-primary w-100">Changer</button></form></div></div></div></div></div></body></html>
